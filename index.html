<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-5260615020571352">
    <title>BALENCIAGA.INK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        #enterScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }

        #enterScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #enterText {
            color: #555;
            font-size: 2rem;
            text-align: center;
            user-select: none;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        #enterText:hover {
            transform: scale(1.05);
            color: #888;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        #overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        #overlay.visible {
            opacity: 1;
        }

        #profileContainer {
            background: rgba(0,0,0,0.7);
            border-radius: 25px;
            padding: 40px 50px;
            border: 2px solid #000;
        }

        #profilePicContainer {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        #profilePic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: block;
        }

        #username {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        #discord {
            font-size: 1.2rem;
            color: #666;
        }

        @media (max-width: 768px) {
            #enterText {
                font-size: 1.5rem;
            }

            #profileContainer {
                padding: 30px 35px;
                border-radius: 20px;
            }

            #profilePic {
                width: 120px;
                height: 120px;
            }

            #username {
                font-size: 2rem;
            }

            #discord {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="enterScreen">
        <div id="enterText">click to enter...</div>
    </div>

    <video loop playsinline>
        <source src="vid.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div id="overlay">
        <div id="profileContainer">
            <div id="profilePicContainer">
                <img id="profilePic" src="100.png" alt="">
            </div>
            <div id="username">BALENCIAGA.INK</div>
            <div id="discord">discord: wirefrauud</div>
        </div>
    </div>

    <script>
        const enterScreen = document.getElementById('enterScreen');
        const video = document.querySelector('video');

        function startExperience() {
            enterScreen.classList.add('hidden');

            video.muted = false;
            video.play().catch(e => {
                console.log('Video play failed:', e);
                video.muted = true;
                video.play();
            });

            setTimeout(() => {
                enterScreen.style.display = 'none';
            }, 500);

            setTimeout(() => {
                document.getElementById('overlay').classList.add('visible');
            }, 1000);
        }

        enterScreen.addEventListener('click', startExperience);
        enterScreen.addEventListener('touchstart', startExperience);
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'Enter') {
                startExperience();
            }
        });
    </script>
</body>
</html>
